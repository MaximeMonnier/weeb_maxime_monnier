# Pile de DÉVELOPPEMENT, autonome : la production est dans compose.prod.yaml.
# Pas de compose.yaml : sans `-f`, une commande échoue au lieu de viser la
# mauvaise pile. `export COMPOSE_FILE=compose.dev.yaml` le pose une fois.

# Nom figé : déduit du dossier, il changerait d'une machine à l'autre. Distinct
# de `weeb-prod`, donc volume distinct : un `down -v` ici épargne la production.
name: weeb

services:
  db:
    image: postgres:17-alpine

    # `:?` interrompt le démarrage avec ce message quand la variable manque,
    # plutôt que de créer une base aux identifiants surprise.
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?absente du .env, voir .env.example}"
      POSTGRES_USER: "${POSTGRES_USER:?absente du .env, voir .env.example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?absente du .env, voir .env.example}"

    # Sur 127.0.0.1 seul : la base reste joignable depuis cette machine — c'est
    # ce qui permet de travailler dans le venv — jamais depuis le réseau local.
    # La production ne publie rien de tout ça.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - interne

    # `-h 127.0.0.1` : sans lui, la sonde passe par la socket Unix et déclare
    # le service sain avant qu'il écoute en TCP. `$$` diffère la substitution
    # au conteneur.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    # Serveur SMTP jetable : il affiche les messages au lieu de les livrer, sur
    # http://127.0.0.1:8025. Absent de la production, qui parlera à un vrai
    # relais. Détail au README, § « Le serveur de mail du développement ».
    image: axllent/mailpit:v1.31.0

    # L'image ne pose aucun `USER` et démarrerait donc en root. Ses ports sont
    # tous au-dessus de 1024 et elle n'écrit rien sur disque tant qu'aucun
    # `MP_DATA_FILE` ne lui est passé : un compte sans privilèges lui suffit.
    user: "1000:1000"

    # Le SMTP est publié en plus de l'interface, comme la base l'est : c'est la
    # voie du backend lancé dans le venv, celui en conteneur passant par le
    # réseau `interne`. Le POP3 de l'image, sur 1110, ne sert à rien ici.
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT_DEV:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT_DEV:-8025}:8025"

    networks:
      - interne

    # Sonde héritée de l'image — `/mailpit readyz` —, seule sa cadence est reprise :
    # les 15 s de l'image feraient attendre le backend, qui dépend de ce service.
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  backend:
    # `image:` explicite : sans elle Compose déduit `<projet>-<service>`, soit
    # `weeb-backend`, le nom même des constructions manuelles du README — qu'il
    # réutiliserait alors au lieu de construire la sienne, sans rien signaler.
    image: weeb-backend:dev

    build: ./backend

    # Le même .env que celui lu par Compose, cette fois versé dans le conteneur.
    # Absent, il interrompt le démarrage au lieu de partir sur des valeurs vides.
    env_file: .env

    # L'image pose `production`, on veut l'inverse. Hôtes et ports contredisent le
    # .env, qui décrit base et mail vus depuis la machine : `db:5432` et
    # `mailpit:1025` sont la topologie du réseau Compose, pas de la configuration.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025

    # Le code de la machine masque celui de l'image : `runserver` surveille ces
    # fichiers-là. Le conteneur y écrit sous l'uid 1001, voir le README.
    volumes:
      - ./backend:/app

    ports:
      - "127.0.0.1:${BACKEND_PORT_DEV:-8000}:8000"

    # L'entrypoint ne prépare la base que devant `gunicorn` : cette commande-ci
    # migre donc elle-même. `exec` pour que runserver reçoive le SIGTERM.
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"]

    # `service_healthy` : Postgres accepte les connexions plusieurs secondes
    # après le démarrage du conteneur, et le `migrate` échouerait entre-temps.
    # Mailpit à la même condition, pour que le code n'ait jamais à s'en assurer.
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

    networks:
      - interne
      - public

    # Sonde héritée de l'image, seule sa cadence est reprise : les 30 s de
    # l'image mèneraient la chaîne des services au-delà de la minute.
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: weeb-frontend:dev

    # `target: dev` sert par Vite ; la production construit le même Dockerfile
    # en `target: prod`, servi par nginx. Ce ne sont pas deux réglages du même
    # serveur, ce sont deux serveurs.
    build:
      context: ./frontend
      target: dev

    # Volume anonyme sur node_modules, EN PLUS du montage du code : sans lui, le
    # frontend/ de la machine masque celui de l'image et Vite ne trouve rien.
    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "127.0.0.1:${FRONTEND_PORT_DEV:-5173}:5173"

    # Le front n'appelle pas l'API depuis le conteneur — c'est le navigateur qui
    # le fait. La dépendance n'ordonne que le démarrage.
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - public

    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

networks:
  # Base et Mailpit ne sont joints que par le backend, seul sur les deux réseaux.
  # `interne` n'est pas fermé, contrairement à la production : les deux sont
  # publiés sur la machine pour le travail en venv.
  interne:
  public:

volumes:
  # Volume nommé, et non un dossier du dépôt : les données ne disparaissent
  # qu'avec `docker compose -f compose.dev.yaml down -v`.
  db_data:

# Pas de compose.yaml, exprès : sans `-f`, une commande échoue au lieu de viser la mauvaise pile.

# Distinct de `weeb-prod` : un `down -v` ici épargne le volume de production.
name: weeb

services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?absente du .env, voir .env.example}"
      POSTGRES_USER: "${POSTGRES_USER:?absente du .env, voir .env.example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?absente du .env, voir .env.example}"

    # 127.0.0.1 : joignable depuis le venv, jamais depuis le réseau local.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - interne

    # -h 127.0.0.1 : sinon la sonde passe par la socket Unix et déclare le service sain avant qu'il écoute en TCP.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.0

    # L'image ne pose aucun `USER` ; ports > 1024 et rien d'écrit sans `MP_DATA_FILE`.
    user: "1000:1000"

    # SMTP publié pour le backend lancé dans le venv.
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT_DEV:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT_DEV:-8025}:8025"

    networks:
      - interne

    # Sonde de l'image, cadence resserrée : ses 15 s retarderaient le backend.
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  backend:
    # Sans nom explicite, Compose réutiliserait sans prévenir le `weeb-backend` d'un `docker build` manuel.
    image: weeb-backend:dev

    build: ./backend

    env_file: .env

    # Prime sur le .env, qui décrit base et mail vus depuis la machine.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025

    # Le conteneur écrit dans ce dossier sous l'uid 1001 (README).
    volumes:
      - ./backend:/app

    ports:
      - "127.0.0.1:${BACKEND_PORT_DEV:-8000}:8000"

    # L'entrypoint ne migre que devant `gunicorn` ; `exec` pour que runserver reçoive le SIGTERM.
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"]

    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

    networks:
      - interne
      - public

    # Cadence resserrée : les 30 s de l'image porteraient la chaîne au-delà de la minute.
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: weeb-frontend:dev

    build:
      context: ./frontend
      target: dev

    # Volume anonyme : sans lui, le code monté masque le node_modules de l'image.
    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "127.0.0.1:${FRONTEND_PORT_DEV:-5173}:5173"

    # N'ordonne que le démarrage : c'est le navigateur qui appelle l'API.
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - public

    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

networks:
  # `interne` reste ouvert, contrairement à la production : base et Mailpit sont publiés pour le venv.
  interne:
  public:

volumes:
  db_data:

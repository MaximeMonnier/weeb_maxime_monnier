# Configuration du terminateur TLS placé devant la pile de production.
# Elle remplace celle de l'image nginx, qui suppose un démarrage en root.
#
# Ce serveur est le SEUL de la pile à publier des ports : le backend et le front
# ne sont plus joignables que par lui, à travers le réseau `public` de Compose.
# C'est aussi lui qui rend DJANGO_BEHIND_PROXY=1 légitime — voir le bloc HTTPS.

worker_processes auto;
error_log /dev/stderr warn;

# Ni /var/run ni /var/cache : le compte nginx n'y écrit pas.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Mêmes raisons que le pid : tous les tampons vont dans /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Ne pas annoncer la version de nginx dans les en-têtes et les pages d'erreur.
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # DNS interne de Docker. Sans lui, et sans variable dans `proxy_pass`, nginx
    # résout `backend` UNE SEULE FOIS au démarrage et garde l'adresse : les deux
    # services repartent en `unless-stopped`, et un redémarrage leur donne une
    # nouvelle IP — le proxy répondrait 502 jusqu'à ce qu'on le redémarre lui.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---------- Tout Host inconnu : aucune réponse ----------
    # Sans ce bloc, les serveurs ci-dessous répondraient à N'IMPORTE QUEL Host,
    # et la redirection réfléchirait dans son en-tête `Location` une valeur
    # forgée par le client. 444 ferme la connexion sans rien renvoyer.
    server {
        listen 8080 default_server;
        listen 8443 ssl default_server;

        # Obligatoires sur un bloc SSL, même pour ne rien servir.
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        return 444;
    }

    # ---------- Le port en clair : redirection, et rien d'autre ----------
    server {
        listen 8080;

        # Les hôtes servis, et non `_` : c'est cette liste qui borne le `$host`
        # de la redirection ci-dessous. Elle reprend DJANGO_ALLOWED_HOSTS, dont
        # 127.0.0.1, l'adresse à laquelle la sonde du conteneur s'adresse.
        server_name localhost 127.0.0.1 "[::1]";

        # Sonde du conteneur, AVANT la redirection : sur la racine elle
        # recevrait un 301 que wget ne suit pas, et le service serait déclaré
        # malade en permanence.
        location = /healthz {
            access_log off;
            # `default_type` et non `add_header` : celui-ci en AJOUTERAIT un
            # second à côté de l'application/octet-stream par défaut.
            default_type text/plain;
            return 200 "ok\n";
        }

        # Aucune requête en clair n'est relayée. C'est ce qui rend inoffensif un
        # X-Forwarded-Proto forgé : il n'atteint jamais Django.
        # $host est sûr ici, et seulement ici : le `server_name` ci-dessus le
        # borne aux deux hôtes servis. Il ne porte pas le port, donc la cible
        # est toujours le 443 canonique.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- Le port chiffré : terminaison TLS et routage ----------
    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost 127.0.0.1 "[::1]";

        # Montés au démarrage, jamais copiés dans l'image : une clé privée n'a
        # sa place ni dans un layer ni dans un registre. `generate-cert.sh` les
        # produit sur la machine.
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # TLS 1.0 et 1.1 sont retirés : plus aucun navigateur courant n'en a
        # besoin, et ils traînent des suites cassées.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        # Les tickets de session rejouent une clé sur tous les tampons : sans
        # rotation, ils affaiblissent la confidentialité persistante.
        ssl_session_tickets off;

        # ⚠️ Ces quatre en-têtes sont hérités par toutes les `location`
        # ci-dessous : proxy_set_header ne s'hérite QUE si le bloc courant n'en
        # déclare aucun, et aucun ne le fait.
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        # $remote_addr seul, et non $proxy_add_x_forwarded_for : ce proxy est en
        # BORDURE, donc la chaîne reçue du client est inventée. La relayer
        # rendrait contournable toute restriction par IP posée en aval.
        proxy_set_header X-Forwarded-For $remote_addr;

        # ⚠️ LA ligne de ce fichier : elle ÉCRASE la valeur du client, elle ne
        # la relaie pas. $http_x_forwarded_proto à la place rouvrirait la faille
        # que ce proxy ferme. Détail au README, § « Le proxy TLS ».
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fichiers statiques de Django : l'admin et l'API navigable de DRF en
        # dépendent. Django ne les sert pas lui-même avec DEBUG=False et l'image
        # n'embarque pas whitenoise — sans ce bloc, les deux arrivent sans style.
        # Le dossier est celui que `collectstatic` remplit au démarrage du
        # backend, partagé par un volume nommé.
        location /static/ {
            alias /srv/static/;
            access_log off;
            # Une heure seulement : `collectstatic` ne met pas d'empreinte dans
            # les noms, un fichier peut donc changer sous la même adresse.
            expires 1h;
        }

        # Les adresses passent par une variable, sans quoi le `resolver`
        # ci-dessus ne s'applique pas : nginx ne consulte le DNS à l'exécution
        # que si `proxy_pass` en contient une.
        set $api_backend backend:8000;
        set $site_front  frontend:8080;

        # $request_uri est écrit explicitement : il porte le chemin ET la chaîne
        # de requête d'origine. Une barre oblique finale à la place
        # (`proxy_pass http://$api_backend/`) amputerait le préfixe `/api/`, et
        # Django répondrait 404 sur toutes les routes.
        location /api/ {
            proxy_pass http://$api_backend$request_uri;
        }

        location /admin/ {
            proxy_pass http://$api_backend$request_uri;
        }

        # Tout le reste au front : c'est lui qui porte le routage React.
        location / {
            proxy_pass http://$site_front$request_uri;
        }
    }
}

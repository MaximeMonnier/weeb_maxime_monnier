# Socle commun aux deux environnements, jamais lancé seul. Les commandes des deux
# piles et le rôle de chaque fichier sont au README, § « La stack complète avec
# Compose ».
#
# Nom de projet figé : sans lui, Compose le déduit du nom du dossier, et les
# conteneurs comme le volume de données changeraient de nom d'une machine à
# l'autre.
name: weeb

services:
  db:
    image: postgres:17-alpine

    # `:?` interrompt le démarrage avec ce message quand la variable manque,
    # plutôt que de créer une base aux identifiants surprise.
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?absente du .env, voir .env.example}"
      POSTGRES_USER: "${POSTGRES_USER:?absente du .env, voir .env.example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?absente du .env, voir .env.example}"

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - interne

    # `-h 127.0.0.1` : sans lui, pg_isready passe par la socket Unix et déclare
    # le service sain avant qu'il écoute en TCP, le chemin de Django.
    # `$$` empêche Compose de substituer la variable ici, pour qu'elle le soit
    # dans le conteneur.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    # Aucune `image:` ici : chaque surcharge nomme la sienne, sinon Compose
    # réutilise l'image du même nom construite à la main. Voir le README.
    build: ./backend

    # Le même .env que celui lu par Compose, cette fois versé dans le conteneur.
    # Absent, il interrompt le démarrage au lieu de partir sur des valeurs vides.
    env_file: .env

    # Contredit volontairement le .env, qui décrit la base vue depuis la machine.
    # Ce n'est pas de la configuration mais la topologie déclarée ci-dessus.
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    # `service_healthy` : Postgres accepte les connexions plusieurs secondes
    # après le démarrage du conteneur, et le `migrate` échouerait entre-temps.
    depends_on:
      db:
        condition: service_healthy

    networks:
      - interne
      - public

    # Sonde héritée de l'image, seule sa cadence est reprise : les 30 s de
    # l'image mèneraient la chaîne des trois services au-delà de la minute.
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    # `target` absent : il n'y a pas d'étape commune aux deux environnements,
    # `dev` servant par Vite et `prod` par nginx.
    build:
      context: ./frontend

    # Le front n'appelle pas l'API depuis le conteneur — c'est le navigateur qui
    # le fait. La dépendance n'ordonne que le démarrage.
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - public

    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

networks:
  # La base n'est jointe que par le backend, et compose.prod.yaml ferme
  # `interne`. Le backend est sur les deux, ce qui lui laisse une sortie.
  interne:
  public:

volumes:
  # Volume nommé, et non un dossier du dépôt : les données ne disparaissent
  # qu'avec `docker compose down -v`.
  db_data:

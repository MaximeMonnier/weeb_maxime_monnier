# Remplace celle de l'image nginx, qui suppose un démarrage en root.

worker_processes auto;
error_log /dev/stderr warn;

# Ni /var/run ni /var/cache : le compte nginx n'y écrit pas.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Même raison que le pid.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    # Sinon une requête portant `Via` repartirait non compressée.
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Hash du script en ligne d'index.html : `src/csp.test.ts` exige qu'ils concordent.
        set $csp "default-src 'self'; script-src 'self' 'sha256-7Ba0RFbwY9J1LwZ253mQXTgb3xl7aWDZZa6ehNlAWlw='; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;

        # Routage de React : sans ce repli, recharger /articles/42 renverrait 404.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ⚠️ add_header ne s'hérite que si le bloc n'en pose aucun : d'où les quatre en-têtes répétés.

        # Un index périmé réclamerait des assets qui n'existent plus.
        location = /index.html {
            add_header Cache-Control          "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $csp always;
        }

        # Noms empreintés par Vite. Pas d'`expires` : doublé d'un add_header, il laisserait deux en-têtes de cache.
        location /assets/ {
            add_header Cache-Control          "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $csp always;
        }

        # Statiques de Django (volume de `collectstatic`) : 404 hors de la pile de production.
        location /static/ {
            alias /srv/static/;
            access_log off;
            # Une heure : `collectstatic` n'empreinte pas les noms.
            expires 1h;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $csp always;
        }

        # Images d'inconnus servies sur l'origine du site : ces extensions seules, sous nosniff.
        # La regex prime sur le préfixe qui suit, lequel refuse le reste.
        location ~* ^/media/(.+\.(?:jpe?g|png|webp))$ {
            alias /srv/media/$1;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $csp always;
        }

        location /media/ {
            return 404;
        }
    }
}

# Configuration complète du serveur de l'image de production.
# Elle remplace celle de l'image nginx, qui suppose un démarrage en root.

worker_processes auto;
error_log /dev/stderr warn;

# Ni /var/run ni /var/cache : le compte nginx n'y écrit pas.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Mêmes raisons que le pid : tous les tampons vont dans /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Ne pas annoncer la version de nginx dans les en-têtes et les pages d'erreur.
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    # Sans gzip_proxied, nginx cesse de compresser dès qu'un en-tête Via est
    # présent — c'est-à-dire derrière le proxy qui terminera le TLS.
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Mêmes garanties que celles posées par Django sur ses propres réponses
        # (X_FRAME_OPTIONS, SECURE_CONTENT_TYPE_NOSNIFF).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # Le routage appartient à React : sans ce repli, un rechargement sur
        # /articles/42 chercherait un fichier de ce nom et renverrait 404.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ⚠️ add_header ne s'hérite QUE si le bloc courant n'en déclare aucun.
        # Les trois en-têtes ci-dessus sont donc répétés dans chaque location qui
        # pose le sien, sous peine de disparaître silencieusement.

        # L'index n'est jamais mis en cache : il désigne des fichiers empreintés,
        # et un index périmé réclamerait des assets qui n'existent plus.
        location = /index.html {
            add_header Cache-Control          "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        }

        # Les noms produits par Vite portent une empreinte du contenu : un fichier
        # donné ne change jamais. Un seul en-tête de cache, et non `expires`
        # doublé d'un add_header, qui en laisserait deux au choix du client.
        location /assets/ {
            add_header Cache-Control          "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY" always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        }
    }
}

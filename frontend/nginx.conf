# Configuration complète du serveur de l'image de production.
# Elle remplace celle de l'image nginx, qui suppose un démarrage en root.

worker_processes auto;
error_log /dev/stderr warn;

# Ni /var/run ni /var/cache : le compte nginx n'y écrit pas.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Mêmes raisons que le pid : tous les tampons vont dans /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Ne pas annoncer la version de nginx dans les en-têtes et les pages d'erreur.
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Le routage appartient à React : sans ce repli, un rechargement sur
        # /articles/42 chercherait un fichier de ce nom et renverrait 404.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Les noms produits par Vite portent une empreinte du contenu : un fichier
        # donné ne change jamais. L'index, lui, n'est délibérément pas mis en cache.
        location /assets/ {
            # Un seul en-tête, et non `expires` doublé d'un add_header : la
            # directive expires en pose déjà un, et deux Cache-Control dans une
            # réponse laissent le client choisir lequel il applique.
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weeb</title>
    <script>
      // Seule source du thème initial : `useTheme` lit la classe posée ici. La CSP de
      // nginx.conf n'autorise ce script que par son hash : changer un caractère, même
      // de ce commentaire, impose de le recalculer, sinon tout le monde est servi en clair.
      (function () {
        var theme = localStorage.getItem("theme");
        var prefereSombre = matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || (!theme && prefereSombre)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

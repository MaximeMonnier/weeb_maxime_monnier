# Pile de PRODUCTION, autonome : le développement est dans compose.dev.yaml.
# Sans TLS : publiée sur 127.0.0.1, servie au monde par le nginx du serveur —
# voir le README, § « Déployer derrière le nginx du serveur ».

# Nom distinct de celui du développement, donc conteneurs, réseaux et volumes
# distincts. Sans ça, un `docker compose -f compose.dev.yaml down -v` détruirait
# les données d'ici.
name: weeb-prod

services:
  db:
    image: postgres:17-alpine

    # `:?` interrompt le démarrage avec ce message quand la variable manque,
    # plutôt que de créer une base aux identifiants surprise.
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?absente du .env, voir .env.example}"
      POSTGRES_USER: "${POSTGRES_USER:?absente du .env, voir .env.example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?absente du .env, voir .env.example}"

    # Aucun `ports:` : la base n'est joignable que par le réseau `interne`,
    # fermé plus bas. Rien n'est publié, donc rien n'est atteignable depuis
    # l'extérieur du démon Docker.

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - interne

    # `unless-stopped` et non `always` : le conteneur repart après un plantage
    # ou un redémarrage, pas un arrêt volontaire. D'où le `--wait-timeout` : sans
    # lui, `--wait` attend indéfiniment un service qui reboucle.
    restart: unless-stopped

    # `-h 127.0.0.1` : sans lui, la sonde passe par la socket Unix et déclare
    # le service sain avant qu'il écoute en TCP. `$$` diffère la substitution
    # au conteneur.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    # `image:` explicite, et étiquetée : le même Dockerfile produit l'image de
    # développement, qui n'a ni les mêmes réglages ni la même commande. Sans
    # elle, Compose déduirait un nom du projet et les deux se confondraient.
    image: weeb-backend:prod

    build: ./backend

    # Le dernier l'emporte : .env.prod réécrit ce qui diffère et ajoute
    # EMAIL_HOST et FRONTEND_URL. ⚠️ Pour le conteneur seul : les `${...}` d'ici
    # se lisent dans le .env — README, § « La configuration de production ».
    env_file:
      - .env
      - .env.prod

    # `production` redit l'image, en regard de compose.dev.yaml. `db:5432` contredit
    # le .env, qui décrit la base vue depuis la machine : c'est la topologie du
    # réseau, pas de la configuration.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    # 127.0.0.1 seul : c'est ce qui borne DJANGO_BEHIND_PROXY=1, le nginx du
    # serveur restant seul à poser X-Forwarded-Proto. Variable distincte de celle du
    # développement, pour que les deux piles tournent ensemble.
    ports:
      - "127.0.0.1:${BACKEND_PORT_PROD:-8001}:8000"

    # Partagé avec le front, qui sert /static/ : Django ne sert pas ses statiques
    # avec DEBUG=False et l'image n'a pas whitenoise. Sans lui, l'admin perd
    # son style.
    volumes:
      - static_data:/app/staticfiles

    # `service_healthy` : Postgres accepte les connexions plusieurs secondes
    # après le démarrage du conteneur, et l'entrypoint migre avant Gunicorn.
    depends_on:
      db:
        condition: service_healthy

    networks:
      - interne
      - public

    restart: unless-stopped

    # Sonde héritée de l'image, seule sa cadence est reprise : les 30 s de
    # l'image mèneraient la chaîne des trois services bien au-delà de la minute.
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: weeb-frontend:prod

    # `target: prod` sert par nginx, sans Node ; le développement construit le
    # même Dockerfile en `target: dev`, servi par Vite. Ce ne sont pas deux
    # réglages du même serveur, ce sont deux serveurs.
    build:
      context: ./frontend
      target: prod

      # L'adresse de l'API est écrite DANS le bundle : elle doit être connue à la
      # construction. `:?` interrompt le build plutôt que de livrer un front qui
      # s'arrête au chargement.
      args:
        VITE_API_URL: "${VITE_API_URL:?absente du .env de la racine, voir .env.example}"

    ports:
      - "127.0.0.1:${FRONTEND_PORT_PROD:-8081}:8080"

    # Lecture seule. Ce nginx sert les statiques pour que celui du serveur n'ait
    # pas à lire les volumes de Docker, traversables par root seul.
    volumes:
      - static_data:/srv/static:ro

    # Le front n'appelle pas l'API depuis le conteneur — c'est le navigateur qui
    # le fait. La dépendance n'ordonne que le démarrage. Elle garantit en outre
    # que `collectstatic` a rempli le volume avant que nginx le serve.
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - public

    restart: unless-stopped

    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

networks:
  # `internal` coupe le réseau de la passerelle de l'hôte : plus aucune entrée
  # ni sortie. La base n'y perd rien, elle ne parle qu'au backend — qui garde
  # `public` pour le reste.
  interne:
    internal: true
  public:

volumes:
  # Volume nommé, et non un dossier du dépôt : les données ne disparaissent
  # qu'avec `docker compose -f compose.prod.yaml down -v`.
  db_data:

  # Volume nommé et non dossier de la machine : un bind-mount n'hérite pas des
  # droits posés par l'image, et `collectstatic` ne pourrait pas y écrire.
  static_data:

# Sans TLS, publiée sur 127.0.0.1 : README, § « Déployer derrière le nginx du serveur ».

# Distinct de `weeb` : un `down -v` du développement épargne ces volumes.
name: weeb-prod

services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?absente du .env, voir .env.example}"
      POSTGRES_USER: "${POSTGRES_USER:?absente du .env, voir .env.example}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?absente du .env, voir .env.example}"

    # Aucun `ports:` : seul le réseau `interne`, fermé, atteint la base.

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - interne

    # D'où le `--wait-timeout` : sans lui, `--wait` attend sans fin un service qui reboucle.
    restart: unless-stopped

    # -h 127.0.0.1 : sinon la sonde passe par la socket Unix et déclare le service sain avant qu'il écoute en TCP.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    # ⚠️ Étiquette absente de GHCR : `up` construit en local sans prévenir, d'où `--no-build`.
    image: "ghcr.io/maximemonnier/weeb-backend:${IMAGE_TAG:-latest}"

    build: ./backend

    # .env.prod l'emporte, pour le conteneur seul : les `${...}` de ce fichier ne lisent que le .env.
    env_file: &env-django
      - .env
      - .env.prod

    # `db:5432` prime sur le .env, qui décrit la base vue depuis la machine.
    environment: &environment-django
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    # 127.0.0.1 seul : c'est ce qui borne DJANGO_BEHIND_PROXY=1.
    ports:
      - "127.0.0.1:${BACKEND_PORT_PROD:-8001}:8000"

    # Servis par le front : Django ne sert rien avec DEBUG=False, pas de whitenoise.
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    depends_on:
      db:
        condition: service_healthy

    networks:
      - interne
      - public

    restart: unless-stopped

    # Cadence resserrée : les 30 s de l'image porteraient la chaîne au-delà de la minute.
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Contacts de plus de 90 jours (durée promise par /privacy) et jetons expirés, toutes les 24 h.
  purge:
    image: "ghcr.io/maximemonnier/weeb-backend:${IMAGE_TAG:-latest}"

    env_file: *env-django
    environment: *environment-django

    # `set -e` : un échec arrête le conteneur et se voit dans `ps`, au lieu de se noyer dans les journaux.
    command:
      - sh
      - -c
      - |
        set -e
        while :; do
          python manage.py purger_contacts
          python manage.py flushexpiredtokens
          echo "Jetons expirés purgés."
          sleep 86400
        done

    # Un `sh` en PID 1 ignore le SIGTERM : sans tini, chaque arrêt attendrait 10 s.
    init: true

    # Sinon la sonde de l'image interroge un Gunicorn qui ne tourne pas ici.
    healthcheck:
      disable: true

    # Les tables à purger n'existent qu'après les migrations du backend.
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - interne

    restart: unless-stopped

  frontend:
    image: "ghcr.io/maximemonnier/weeb-frontend:${IMAGE_TAG:-latest}"

    build:
      context: ./frontend
      target: prod

      # Écrite dans le bundle : sans elle, le front s'arrêterait au chargement.
      args:
        VITE_API_URL: "${VITE_API_URL:?absente du .env de la racine, voir .env.example}"

    ports:
      - "127.0.0.1:${FRONTEND_PORT_PROD:-8081}:8080"

    # Ce nginx sert les statiques : celui du serveur ne lit pas les volumes Docker, réservés à root.
    volumes:
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro

    # Garantit aussi que `collectstatic` a rempli le volume avant que nginx le serve.
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - public

    restart: unless-stopped

    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s

networks:
  # Ni entrée ni sortie : la base ne parle qu'au backend.
  interne:
    internal: true
  public:

volumes:
  db_data:

  # Pas de bind-mount : il n'hériterait pas des droits de l'image, `collectstatic` n'y écrirait pas.
  static_data:

  # Seule copie des images d'articles, perdue avec `down -v`.
  media_data:

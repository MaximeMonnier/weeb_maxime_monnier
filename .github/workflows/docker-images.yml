name: Images Docker

on:
  push:
    branches: [preprod, main]
  pull_request:
    branches: [preprod, main]

# Pas d'annulation sur main : elle couperait un déploiement en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  construire:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Accordé aussi aux PR : seule la condition `publier` les empêche de pousser.
    permissions:
      contents: read
      packages: write

    env:
      # Push sur main seulement, sinon preprod et les PR écraseraient `latest`.
      publier: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # GHCR refuse les majuscules du propriétaire.
      depot: ghcr.io/maximemonnier/weeb-${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            contexte: ./backend

          - image: frontend
            contexte: ./frontend
            cible: prod
            # Relative : même origine que le site.
            arguments: VITE_API_URL=/api

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: env.publier == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexte }}
          target: ${{ matrix.cible }}
          build-args: ${{ matrix.arguments }}
          push: ${{ env.publier == 'true' }}
          tags: |
            ${{ env.depot }}:${{ github.sha }}
            ${{ env.depot }}:latest
          # Rattache le paquet au dépôt : il en hérite les droits, pas la visibilité.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Une portée par image, sinon les deux s'écrasent tour à tour.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deployer:
    name: déploiement
    # Après les DEUX images : un SHA dont une seule est publiée ne se tire pas.
    needs: construire
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploiement-vps
      cancel-in-progress: false

    steps:
      - name: Clé et empreinte du VPS
        env:
          CLE: ${{ secrets.VPS_SSH_KEY }}
          EMPREINTE: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploiement
          printf '%s\n' "$CLE" > ~/.ssh/deploiement
          printf '%s\n' "$EMPREINTE" > ~/.ssh/known_hosts

      - name: Déploiement de ${{ github.sha }}
        env:
          HOTE: ${{ secrets.VPS_HOST }}
          COMPTE: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: >-
          ssh -i ~/.ssh/deploiement -p "${PORT:-22}"
          -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
          "$COMPTE@$HOTE" "/home/apps/docker/apps/weeb/scripts/deployer-vps.sh $GITHUB_SHA"

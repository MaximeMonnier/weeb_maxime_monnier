# Construit les deux images à chaque intégration, depuis une machine vierge, et
# ne les publie sur GHCR qu'au push sur main : voir « Intégration continue »
# dans le README.

name: Images Docker

on:
  push:
    branches: [preprod, main]
  pull_request:
    branches: [preprod, main]

# Un nouveau push rend l'exécution en cours caduque : deux constructions
# complètes pour un résultat que plus personne ne lira.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  construire:
    # Le nom du job nomme l'image : un journal rouge désigne la construction en
    # cause sans qu'il faille l'ouvrir.
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Accordé aussi aux PR, faute de permissions conditionnelles : c'est la
    # condition `publier` qui les empêche de pousser.
    permissions:
      contents: read
      packages: write

    env:
      # Push sur main seulement, sinon chaque PR écraserait `latest`.
      publier: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # GHCR refuse les majuscules du propriétaire.
      depot: ghcr.io/maximemonnier/weeb-${{ matrix.image }}

    strategy:
      # Les deux vont au bout même si l'une casse : une seule exécution suffit
      # alors à connaître l'état des deux.
      fail-fast: false
      matrix:
        include:
          - image: backend
            contexte: ./backend

          - image: frontend
            contexte: ./frontend
            # La cible dev est hors périmètre : elle ne sert qu'au poste.
            cible: prod
            # Écrite DANS le bundle à la construction, pas lue au démarrage, et
            # le build s'interrompt si elle manque. Relative : même origine.
            arguments: VITE_API_URL=/api

    steps:
      - uses: actions/checkout@v7

      # buildx pour le cache : le démon Docker ne garde rien d'une machine
      # jetable à la suivante.
      - uses: docker/setup-buildx-action@v4

      - if: env.publier == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexte }}
          target: ${{ matrix.cible }}
          build-args: ${{ matrix.arguments }}
          push: ${{ env.publier == 'true' }}
          tags: |
            ${{ env.depot }}:${{ github.sha }}
            ${{ env.depot }}:latest
          # Rattache le paquet au dépôt, dont il hérite les droits d'accès.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Une portée par image, sinon les deux écrasent tour à tour la même
          # et le passage suivant repart de zéro.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

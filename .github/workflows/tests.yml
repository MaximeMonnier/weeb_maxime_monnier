name: Tests

on:
  push:
    branches: [preprod, main]
  pull_request:
    branches: [preprod, main]

# Groupe au nom du workflow : celui-ci et docker-images.yml ne s'annulent pas l'un l'autre.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    services:
      db:
        # Même version que compose.dev.yaml.
        image: postgres:17-alpine

        # Répétés dans `env` plus bas : ce contexte n'est pas lisible depuis `services`.
        env:
          POSTGRES_DB: weeb
          POSTGRES_USER: weeb
          POSTGRES_PASSWORD: mot-de-passe-de-ci

        ports:
          - 5432:5432

        # -h 127.0.0.1 : sinon la sonde déclare le service prêt avant qu'il écoute en TCP.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U weeb -d weeb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: weeb
      POSTGRES_USER: weeb
      POSTGRES_PASSWORD: mot-de-passe-de-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Même version que backend/Dockerfile.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Suite Django
        run: python manage.py test

      # `-r` : l'environnement du job contient aussi pip-audit, qui ne part pas en ligne.
      - name: Audit des dépendances
        if: ${{ !cancelled() }}
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    env:
      # Exigée par lib/api.ts et vite.config.ts ; frontend/.env n'est pas versionné.
      VITE_API_URL: /api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Même version que frontend/Dockerfile.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Contrôle du style
        run: npm run lint

      # `!cancelled()` : un style refusé ne cache pas l'état des tests et du build.
      - name: Suite Vitest
        if: ${{ !cancelled() }}
        run: npm test

      # `tsc -b` contrôle aussi vite.config.ts et e2e/, que rien d'autre ne compile ici.
      - name: Build de production
        if: ${{ !cancelled() }}
        run: npm run build

      # Sans `--omit=dev` : l'outillage de build et de test s'exécute ici.
      - name: Audit des dépendances
        if: ${{ !cancelled() }}
        run: npm audit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Jetables. `E2E_*` et `DJANGO_SUPERUSER_*` désignent le même compte.
    env:
      E2E_EMAIL: parcours@weeb.local
      E2E_PASSWORD: Parcours-de-ci-42
      COMPOSE_FILE: compose.dev.yaml

    steps:
      - uses: actions/checkout@v7

      # Sans frontend/.env, le Vite du conteneur (code monté) s'arrête au chargement.
      - name: Fichiers d'environnement
        run: |
          cp .env.example .env
          cp frontend/.env.example frontend/.env

      # Avant la pile : son volume anonyme créerait frontend/node_modules au nom de root.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Chromium suit la version de @playwright/test : après npm ci, jamais avant.
      - name: Playwright et Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Ne borne que l'attente des sondes (~20 s mesurées), pas la construction.
      - name: Pile de développement
        run: docker compose up -d --wait --wait-timeout 180

      # --noinput lit DJANGO_SUPERUSER_<CHAMP> ; `exec` ne transmet que les `-e` nommés.
      - name: Compte de test actif
        env:
          DJANGO_SUPERUSER_EMAIL: ${{ env.E2E_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ env.E2E_PASSWORD }}
          DJANGO_SUPERUSER_FIRST_NAME: Parcours
          DJANGO_SUPERUSER_LAST_NAME: Navigateur
        run: >-
          docker compose exec -T
          -e DJANGO_SUPERUSER_EMAIL
          -e DJANGO_SUPERUSER_PASSWORD
          -e DJANGO_SUPERUSER_FIRST_NAME
          -e DJANGO_SUPERUSER_LAST_NAME
          backend python manage.py createsuperuser --noinput

      # `CI`, posée par GitHub, arme le `forbidOnly` de playwright.config.ts.
      - name: Parcours en navigateur
        working-directory: frontend
        run: npm run test:e2e

      - name: Journaux de la pile
        if: ${{ failure() }}
        run: docker compose logs

      # La trace contient le mot de passe en clair, d'un compte jetable.
      - name: Traces Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: traces-playwright
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

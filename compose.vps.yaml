# Surcouche de compose.prod.yaml : le nginx du VPS, en conteneur sur `web`, n'atteint pas le
# 127.0.0.1 de l'hôte. Alias uniques sur ce réseau partagé (README, § « Déployer sur le VPS »).

services:
  backend:
    ports: !reset []
    networks:
      web:
        aliases: [weeb-backend]

  frontend:
    ports: !reset []
    networks:
      web:
        aliases: [weeb-frontend]

networks:
  web:
    external: true

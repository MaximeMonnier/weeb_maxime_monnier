# Surcharge de développement : code monté, ports publiés, rechargement à chaud.
# Compose la charge d'office avec compose.yaml, donc `docker compose up -d --wait`
# suffit — et c'est pourquoi la production passe des `-f` explicites.

services:
  db:
    # Publication absente du socle, que la production n'en hérite pas : Compose
    # sait ajouter une entrée héritée, jamais la retirer. Sur 127.0.0.1 seul, la
    # base reste joignable depuis cette machine, jamais depuis le réseau local.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  backend:
    image: weeb-backend:dev

    # L'image pose `production`. En développement on veut l'inverse : page
    # d'erreur détaillée, pas de redirection HTTPS, CORS ouvert sur Vite.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development

    # Le code de la machine masque celui de l'image : `runserver` surveille ces
    # fichiers-là. Le conteneur y écrit sous l'uid 1001, voir le README.
    volumes:
      - ./backend:/app

    ports:
      - "127.0.0.1:${BACKEND_PORT_DEV:-8000}:8000"

    # L'entrypoint ne prépare la base que devant `gunicorn` : cette commande-ci
    # migre donc elle-même. `exec` pour que runserver reçoive le SIGTERM.
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"]

  frontend:
    image: weeb-frontend:dev

    build:
      target: dev

    # Volume anonyme sur node_modules, EN PLUS du montage du code : sans lui, le
    # frontend/ de la machine masque celui de l'image et Vite ne trouve rien.
    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "127.0.0.1:${FRONTEND_PORT_DEV:-5173}:5173"
